name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: verilator --version
      - run: make lint
      - run: make regress
      - run: make bug
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: logs, path: logs/ }
